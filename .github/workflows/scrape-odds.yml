name: Scrape Odds Data (Top Leagues)

on:
  # Run every 8 minutes with 4-minute in-job cadence.
  schedule:
    - cron: '*/8 * * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: odds-scrape-top-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      ODDS_FAST: 0
      SCRAPE_REPEAT: 2
      SCRAPE_INTERVAL_SECONDS: 240
      REQUIRE_FULL_TOP_LEAGUE_COVERAGE: 1
      ALLOW_SINGLE_BOOKIE_MAJORS: 0
      ODDSAPI_SOCCER_LIMIT: 12
      ODDSAPI_SOCCER_KEYS: soccer_epl,soccer_spain_la_liga,soccer_italy_serie_a,soccer_germany_bundesliga,soccer_france_ligue_one,soccer_uefa_champs_league,soccer_uefa_europa_conference_league,soccer_portugal_primeira_liga,soccer_mexico_ligamx,soccer_england_efl_cup
      BETWAY_PROXY_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
      WORKER_API_SECRET: ${{ secrets.WORKER_API_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Prepare data worktree
        run: |
          set -euo pipefail
          WORKTREE_PATH="${RUNNER_TEMP}/odds-data"
          git fetch origin data >/dev/null 2>&1 || true
          if [ -d "$WORKTREE_PATH" ]; then
            git worktree remove -f "$WORKTREE_PATH" >/dev/null 2>&1 || true
            rm -rf "$WORKTREE_PATH"
          fi
          if ! git worktree add -B data "$WORKTREE_PATH" origin/data 2>/dev/null; then
            git worktree add -B data "$WORKTREE_PATH"
          fi
          echo "WORKTREE_PATH=$WORKTREE_PATH" >> "$GITHUB_ENV"

      - name: Run odds scraper loop
        env:
          # Cloudflare worker env for odds upload
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          D1_CANONICAL_INGEST: ${{ secrets.D1_CANONICAL_INGEST }}
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
          WORKER_API_SECRET: ${{ secrets.WORKER_API_SECRET }}
        run: |
          set -uo pipefail
          repeat="${SCRAPE_REPEAT:-1}"
          interval="${SCRAPE_INTERVAL_SECONDS:-240}"
          success=0

          for i in $(seq 1 "$repeat"); do
            start=$(date +%s)
            echo "Scrape cycle $i/$repeat"
            rm -f odds_data.json

            if ! python scrape_odds_github.py; then
              echo "Scrape failed; skipping this cycle."
              continue
            fi

            if ! python tools/validate_snapshot.py; then
              echo "Snapshot validation failed; skipping this cycle."
              continue
            fi
            success=1

            worktree="${WORKTREE_PATH:-${RUNNER_TEMP}/odds-data}"
            git -C "$worktree" reset --hard >/dev/null
            git -C "$worktree" clean -fdx >/dev/null
            cp -f odds_data.json "$worktree/odds_data.json"
            if [ -f odds_heartbeat.json ]; then
              cp -f odds_heartbeat.json "$worktree/odds_heartbeat.json"
            fi
            git -C "$worktree" add odds_data.json
            if [ -f "$worktree/odds_heartbeat.json" ]; then
              git -C "$worktree" add odds_heartbeat.json
            fi
            git -C "$worktree" \
              -c user.name="oddswize-bot" \
              -c user.email="actions@github.com" \
              commit -m "Update odds data" >/dev/null
            git -C "$worktree" push -f origin data

            if [ "$i" -lt "$repeat" ]; then
              elapsed=$(( $(date +%s) - start ))
              sleep_for=$(( interval - elapsed ))
              if [ "$sleep_for" -gt 0 ]; then
                echo "Sleeping ${sleep_for}s before next cycle"
                sleep "$sleep_for"
              fi
            fi
          done

          if [ "$success" -eq 0 ]; then
            echo "No successful scrape cycles; failing job."
            exit 1
          fi

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odds-data-top-${{ github.run_number }}
          path: |
            odds_data.json
            odds_heartbeat.json
          retention-days: 1
